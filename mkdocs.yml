site_name: Yuhengyy 的小站
site_description: 把好奇心写成日常。关于 Unity、C#，和那些值得记录的小发现。
site_author: Yuhengyy
site_url: https://yuhengyy.github.io/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  logo: assets/brand/leaf.svg
  favicon: assets/brand/leaf.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到夜间
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到白天
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: journal
      authors: false
      post_date_format: yyyy年M月d日
      post_url_format: "{slug}"
      archive_name: 按年归档
      categories_name: 分类
      pagination_per_page: 6
      draft_on_serve: false
  - tags

hooks:
  - scripts/site_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# 个人博客入口；旧文章 URL 保留，随记和归档由博客插件维护。
nav:
  - 首页: index.md
  - 文章: articles/index.md
  - 随记:
      - journal/index.md
  - 标签: tags/index.md
  - 笔记:
    - projects/index.md
    - C#:
      - 仓库概览: projects/csharp/study-csharp.md
      - 项目索引: projects/csharp/index.md
      - 优先队列: projects/csharp/priority-queue.md
      - 唐老狮综合: projects/csharp/tang-comprehensive.md
    - Unity:
      - 索引: projects/unity/index.md
      - MMO 项目: projects/unity/mmo-game.md
      - 类幸存者: projects/unity/qframework-sgame.md
      - QFramework 学习: projects/unity/qframework-study.md
      - QFramework 创建: projects/unity/qframework-create.md
      - QFramework 游戏: projects/unity/qframework-games.md
      - 三消游戏: projects/unity/match3-game.md
      - 三消 DOTween: projects/unity/match3-dotween.md
      - 斗地主: projects/unity/landlord-game.md
      - TCP 网络: projects/unity/tcp-network.md
      - A* 寻路: projects/unity/astar-navigation.md
      - 对话系统(免费): projects/unity/dialogue-system-free.md
      - 对话系统(Pro): projects/unity/dialogue-system-pro.md
      - 道具工具: projects/unity/item-toolkit.md
      - 通用工具: projects/unity/utility-toolkit.md
    - 技术笔记:
      - 索引: knowledge/index.md
      - C# 笔记: knowledge/csharp-notes.md
      - 数据持久化: knowledge/data-Persistence.md
      - 框架笔记: knowledge/framework-notes.md
      - 问题记录: knowledge/problems.md
      - 学习心得: knowledge/reflections.md
      - Unity 笔记: knowledge/unity-notes.md
      - 网络基础: knowledge/net-notes.md
    - 学习进度:
      - 索引: progress/index.md
      - 已完成: progress/completed.md
      - 计划: progress/plan.md
      - 待办: progress/todo.md
  - 关于:
      - 索引: about/index.md
      - 目标: about/goals.md
      - 简历: about/resume.md
      - 本站说明: workspace/index.md
      - 代码来源: workspace/repos.md
      - 写作指南: workspace/writing.md
      - 预览与发布: workspace/publish.md

copyright: Copyright &copy; 2025–2026 Yuhengyy

extra:
  generator: false
  featured_posts:
    - journal/posts/a-new-chapter.md
    - projects/unity/mmo-game.md
    - knowledge/framework-notes.md
    - knowledge/data-Persistence.md
    - projects/csharp/priority-queue.md
    - knowledge/net-notes.md
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuhengyy
      name: 代码仓库
