site_name: Yuhengyy 的小站
site_description: 把好奇心写成日常。关于 Unity、C#，和那些值得记录的小发现。
site_author: Yuhengyy
site_url: https://yuhengyy.github.io/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  logo: assets/brand/leaf.svg
  favicon: assets/brand/leaf.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到夜间
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到白天
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - tags

hooks:
  - scripts/site_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# 个人博客入口；旧文章 URL 保留，随记和归档由博客插件维护。
nav:
  - 首页: index.md
  - 文章:
      - articles/index.md
      - C# 学习复盘: knowledge/csharp-notes.md
      - 数据持久化: knowledge/data-Persistence.md
      - 框架学习: knowledge/framework-notes.md
      - Unity 路径: knowledge/unity-notes.md
      - 网络基础: knowledge/net-notes.md
      - MMO 实践: projects/unity/mmo-game.md
      - 标签: tags/index.md
  - 关于: about/index.md

copyright: Copyright &copy; 2025–2026 Yuhengyy

extra:
  generator: false
  featured_posts:
    - knowledge/csharp-notes.md
    - knowledge/data-Persistence.md
    - knowledge/framework-notes.md
    - knowledge/unity-notes.md
    - knowledge/net-notes.md
    - projects/unity/mmo-game.md
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuhengyy
      name: 代码仓库
