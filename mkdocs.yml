site_name: Yuhengyy的学习笔记
site_description: 个人Unity与C#学习记录，课程项目实践与知识点整理
site_author: Yuhengyy

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.indexes
    - content.tabs.link
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# 导航配置 - 重构为以课程项目为核心
nav:
  - 首页:
      - 首页: index.md
      - 学习经历[主学习和小项目工具]: knowledge/index.md
      - Unity [游戏项目]: projects/unity/index.md
      - C#[网络项目]: knowledge/net-notes.md

# 其他配置
copyright: Copyright &copy; 2025 Yuhengyy · 个人学习记录

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuhengyy
      name: 代码仓库
